default:
  image: eclipse-temurin:25-jdk

stages:
  - test
  - build
  - deploy

junit:
  stage: test
  script:
    - ./gradlew test

generate_artifacts:
  stage: build
  script:
    - ./gradlew clean jar
  artifacts:
    paths:
      - build/libs/seng202_team1-*.jar

generate_backend_artifact:
  stage: build
  script:
    - ./gradlew backendJar
  artifacts:
    paths:
      - build/libs/taserver.jar
    expire_in: 1 hour
  only:
    - backend

build_backend_image:
  stage: build
  needs: [generate_backend_artifact]
  script:
    - docker build --no-cache -t taserver:$CI_COMMIT_SHORT_SHA -f Dockerfile.backend .
    - docker save taserver:$CI_COMMIT_SHORT_SHA | gzip > taserver-image.tar.gz
  artifacts:
    paths: [taserver-image.tar.gz]
    expire_in: 1 hour
  only:
    - backend

deploy_backend:
  stage: deploy
  image: alpine:latest
  needs: [build_backend_image]
  before_script:
    - apk add --no-cache openssh-client curl bash
    - curl -L -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
    - chmod +x /usr/local/bin/cloudflared
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - |
      cat > ~/.ssh/config <<EOF
      Host deploy
        HostName deploy.maxtyson.net
        User $DEPLOY_USER
        ProxyCommand cloudflared access ssh --hostname %h --service-token-id $CF_ACCESS_CLIENT_ID --service-token-secret $CF_ACCESS_CLIENT_SECRET
        StrictHostKeyChecking no
      EOF
  script:
    - scp taserver-image.tar.gz deploy:/opt/trash-app/incoming.tar.gz
    - |
      ssh deploy bash -s <<EOF
        cd /opt/trash-app
        gunzip -f incoming.tar.gz
        docker load < incoming.tar
        docker tag taserver:$CI_COMMIT_SHORT_SHA taserver:latest
        docker compose up -d taserver
        rm -f incoming.tar
      EOF
  only:
    - backend