<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <!-- Leaflet core -->
    <link rel="stylesheet" href="../thirdparty/unpkg/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="../thirdparty/unpkg/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet.markercluster plugin -->
    <link rel="stylesheet" href="../thirdparty/unpkg/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
    <link rel="stylesheet" href="../thirdparty/unpkg/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
    <script src="../thirdparty/unpkg/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <!-- Leflet.pouchdb plugin -->
    <script src="../thirdparty/unpkg/pouchdb@^5.2.0/dist/pouchdb.js"></script>
    <script src="../thirdparty/unpkg/pouchdb@^5.2.0/dist/L.TileLayer.PouchDBCached.js"></script>

    <!-- Leflet.routing plugin -->
    <link rel="stylesheet" href="../thirdparty/unpkg/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>
    <script src="../thirdparty/unpkg/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .dark-tiles .leaflet-tile-container img {
            mix-blend-mode: multiply;
        }

        .leaflet-marker-icon.active {
            transform: scale(1.5);
            z-index: 1000 !important;
        }
    </style>
</head>
<body>

<div id="map" style="width: 100vw; height: 100vh" class="map-container dark-tiles">
</div>

<script>

    const ICON_FOLDER = new URL('../media/images/', document.location.href).href;

    onPointClicked = (id) => {
        setSelectedPoint(id);
        callJavaAPI("onPointClicked", {id});
    }

    onPosClicked = (lat, lng) => {
        callJavaAPI("onPosClicked", {lat, lng});
    }

    // Marker helpers
    styleActiveMarker = (target, isActive) => {

        // Nothing to style
        if (!target)
            return;

        const node = target.getElement();
        if (!node)
            return;

        if (isActive) {
            // Dont add if already added
            if (!node.classList.contains("active"))
                node.classList.add("active");
        } else {
            node.classList.remove("active");
        }
    }

    setSelectedPoint = (id) => {

        // Clear old marker
        if (selectedMarker)
            styleActiveMarker(selectedMarker, false);

        let toggle = selectedMarker !== markerMap[id];

        selectedMarker = toggle ? markerMap[id] : null;
        styleActiveMarker(selectedMarker, true);
        centerOnMarker(id);

    }

    centerOnMarker = (id) => {
        const marker = markerMap[id];

        // Center on marker (with space to left to account for the open side bar)
        if (marker) {
            map.setView(marker.getLatLng(), map.getZoom(), {animate: false});
            map.panBy([window.innerWidth * 0.15, 0], {animate: false});
        }
    };

    const iconCache = {};
    makeIcon = (L, name) => {
        if (iconCache[name])
            return iconCache[name];

        const icon = L.icon({
            iconUrl: `${ICON_FOLDER}pin-${name}.svg`,
            iconSize: [40, 50],
        });

        iconCache[name] = icon;

        // Preload the image
        const img = new Image();
        img.src = icon.options.iconUrl;

        return icon
    }


    const binSvg = (lidColour) => `
        <svg width="200" height="260" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
          <path d="
            M 80 10
            L 120 10
            Q 168 10 168 30
            L 32 30
            Q 32 10 80 10
            Z"
            fill="${lidColour}"
            stroke="#000000"
            stroke-width="2.5"
            stroke-linejoin="round"
          />
          <path d="
            M 168 30
            L 160 150
            Q 160 162 150.8 169.7
            L 139.2 179.3
            Q 130 187 125 197.9
            L 103.4 244.7
            Q 100 252 96.6 244.7
            L 75 197.9
            Q 70 187 60.8 179.3
            L 49.2 169.7
            Q 40 162 40 150
            L 32 30
            Z"
            fill="#1D3320"
            stroke="#000000"
            stroke-width="2.5"
            stroke-linejoin="round"
          />
          <line x1="32" y1="30" x2="168" y2="30" stroke="#000000" stroke-width="2.5"/>


        </svg>
    `;

    const makeClusterIcon = (cluster) => {
        const count = cluster.getChildCount();

        const svg = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="140 0 120 160" width="60" height="80">
              <g transform="translate(170,0) scale(0.25)">${binSvg('#E53935')}</g>
              <g transform="translate(150,25) scale(0.25)">${binSvg('#41965b')}</g>
              <g transform="translate(190,25) scale(0.25)">${binSvg('#FFEB3B')}</g>
              <circle cx="200" cy="100" r="40" fill="#41965b" stroke="#ffffff" stroke-width="6"/>
              <text x="200" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-weight="bold" font-size="40"  fill="#fff">
                ${count}
              </text>
            </svg>
        `;

        return L.divIcon({
            html: svg,
            className: 'cluster-icon',
            iconSize: [60, 80],
            iconAnchor: [30, 80],
        });
    };


    let route = null;
    const setRoute = (startLat, startLng, endLat, endLng) => {

        // Create a new route
        route = L.Routing.control({
            waypoints: [
                L.latLng(startLat, startLng),
                L.latLng(endLat, endLng)
            ],
            router: L.Routing.osrmv1({serviceUrl: 'https://tile.csse.canterbury.ac.nz/route/v1'}),
            profile: 'walking',
            routeWhileDragging: true,
            createMarker: () => {
            },
            lineOptions: {
                styles: [{color: '#41965b', weight: 8}]
            }
        }).addTo(map);

        // Pass route to frontend
        route.on('routesfound', e => {

            // Clean route first
            const route = e.routes[0].instructions.map(i => ({
                text: i.text,
                type: i.type,
                distance: i.distance,
                time: i.time
            }));

            callJavaAPI("onMapRouted", {route: JSON.stringify(route)});
        });
    }

    const clearRoute = () => {
        if (!route)
            return

        map.removeControl(route);
        route = null;
    }


    let markerMap = {};
    let selectedMarker = null;

    // Centre around chch
    var coords = [-43.5233, 172.5822];
    var zoomLevel = 16;

    // Create the map (without gpux)
    var map = L.map('map').setView(coords, zoomLevel);
    L.Browser.any3d = false;

    //remove leaflet link (keep words for attribution)
    map.attributionControl.setPrefix('Leaflet');

    // Custom style to fit the app
    // see toolchain/snazzy.js for conversion
    var snazzyStyle = 's.e%3Al.i%7Cp.v%3Aoff%2Cs.e%3Al.t.f%7Cp.c%3A%23ff6c6d68%2Cs.e%3Al.t.s%7Cp.c%3A%23ffffffff%2Cs.t%3A0%7Cs.e%3Ag%7Cp.c%3A%23fff9f8f6%2Cs.t%3A1%7Cs.e%3Ag.s%7Cp.c%3A%23ffe4e0da%2Cs.t%3Aundefined%7Cs.e%3Ag.f%7Cp.c%3A%23ffffffff%2Cs.t%3Aundefined%7Cs.e%3Ag.s%7Cp.c%3A%23ffebe9e5%2Cs.t%3A5%7Cs.e%3Ag%7Cp.c%3A%23ffefedea%2Cs.t%3A2%7Cs.e%3Ag%7Cp.c%3A%23fff2f0ec%2Cs.t%3A40%7Cs.e%3Ag.f%7Cp.c%3A%23ffcce3c1%2Cs.t%3A39%7Cs.e%3Ag.f%7Cp.c%3A%23ffcce3c1%2Cs.t%3A33%7Cs.e%3Ag.f%7Cp.c%3A%23ffcce3c1%2Cs.t%3A37%7Cs.e%3Ag.f%7Cp.c%3A%23ffcce3c1%2Cs.t%3A3%7Cs.e%3Ag.f%7Cp.c%3A%23ffffffff%2Cs.t%3A3%7Cs.e%3Ag.s%7Cp.c%3A%23ffe4e0da%2Cs.t%3A49%7Cs.e%3Ag.f%7Cp.c%3A%23fff5f4f1%2Cs.t%3A49%7Cs.e%3Ag.s%7Cp.c%3A%23ffd2cbc2%2Cs.t%3A4%7Cs.e%3Ag%7Cp.c%3A%23ffebe9e5%2Cs.t%3A4%7Cs.e%3Al%7Cp.v%3Aoff%2Cs.t%3A6%7Cs.e%3Ag.f%7Cp.c%3A%23ffaed2f6';

    // Draw the map tiles
    L.tileLayer(`https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&apistyle=${snazzyStyle}`, {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
        attribution: '&copy; Google Maps',
    }).addTo(map);

    // When no point is clicked clear the previous
    map.on('click', e => {
        const lat = e.latlng.lat;
        const lng = e.latlng.lng;

        L.DomEvent.stopPropagation(e);

        setSelectedPoint(null)
        onPosClicked(lat, lng);
    })

    // Cluster markers to prevent lag
    let marker;
    let markers = L.markerClusterGroup({
        disableClusteringAtZoom: 16,
        iconCreateFunction: makeClusterIcon,
    });
    map.addLayer(markers);

    //prevent right clicking map
    document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
    }, false);

</script>
</body>
</html>
