<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <!-- Leaflet core -->
    <link rel="stylesheet" href="../thirdparty/unpkg/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="../thirdparty/unpkg/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet.markercluster plugin -->
    <link rel="stylesheet" href="../thirdparty/unpkg/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
    <link rel="stylesheet" href="../thirdparty/unpkg/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
    <script src="../thirdparty/unpkg/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <!-- Leflet.pouchdb plugin -->
    <script src="../thirdparty/unpkg/pouchdb@^5.2.0/dist/pouchdb.js"></script>
    <script src="../thirdparty/unpkg/pouchdb@^5.2.0/dist/L.TileLayer.PouchDBCached.js"></script>

    <!-- Leflet.routing plugin -->
    <link rel="stylesheet" href="../thirdparty/unpkg/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="../thirdparty/unpkg/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .leaflet-tile-container img {
            outline: 1px solid transparent;
            mix-blend-mode: multiply;
        }

        .active {
            filter: drop-shadow(0 0 8px rgba(45, 163, 100, 0.9)) drop-shadow(0 0 16px rgba(31, 107, 69, 0.7));
            transform: scale(1.5);
        }
    </style>
</head>
<body>

<div id="map" style="width: 100vw; height: 100vh" class="map-container dark-tiles">
</div>

<script>

    const ICON_FOLDER = new URL('../media/images/', document.location.href).href;

    onPointClicked = (id) => {
        setSelectedPoint(id);
        callJavaAPI("onPointClicked", {id});
    }

    onPosClicked = (lat, lng) => {
        callJavaAPI("onPosClicked", {lat, lng});
    }

    // Marker helpers
    styleActiveMarker = (target, isActive) => {

        // Nothing to style
        if (!target)
            return;

        const node = target.getElement();

        if (isActive) {
            // Dont add if already added
            if (!node.classList.contains("active"))
                node.classList.add("active");
        } else {
            node.classList.remove("active");
        }
    }

    setSelectedPoint = (id) => {

        // Clear old marker
        if (selectedMarker)
            styleActiveMarker(selectedMarker, false);

        let toggle = selectedMarker !== markerMap[id];

        selectedMarker = toggle ? markerMap[id] : null;
        styleActiveMarker(selectedMarker, true);
        centerOnMarker(id);

    }

    centerOnMarker = (id) => {
        const marker = markerMap[id];

        // Center on marker (with space to left to account for the open side bar)
        if (marker) {
            map.setView(marker.getLatLng(), map.getZoom(), {animate: false});
            map.panBy([window.innerWidth * 0.15, 0], {animate: false});
        }
    };

    const iconCache = {};
    makeIcon = (L, name) => {
        if (iconCache[name])
            return iconCache[name];

        const icon = L.icon({
            iconUrl: `${ICON_FOLDER}pin-${name}.svg`,
            iconSize: [40, 50],
        });

        iconCache[name] = icon;

        // Preload the image
        const img = new Image();
        img.src = icon.options.iconUrl;

        return icon
    }

    let route = null;
    const setRoute = (startLat, startLng, endLat, endLng) => {

        // Create a new route
        route = L.Routing.control({
            waypoints: [
                L.latLng(startLat, startLng),
                L.latLng(endLat, endLng)
            ],
            router: L.Routing.osrmv1({serviceUrl: 'https://tile.csse.canterbury.ac.nz/route/v1'}),
            profile: 'walking',
            routeWhileDragging: true,
            createMarker: () => {},
            lineOptions: {
                styles: [ { color: '#41965b', weight: 8 } ]
            }
        }).addTo(map);

        // Pass route to frontend
        route.on('routesfound', e => {

            // Clean route first
            const route = e.routes[0].instructions.map(i => ({
                text: i.text,
                type: i.type,
                distance: i.distance,
                time: i.time
            }));

            callJavaAPI("onMapRouted", {route: JSON.stringify(route)});
        });
    }

    const clearRoute = () => {
        if (!route)
            return

        map.removeControl(route);
        route = null;
    }


    let markerMap = {};
    let selectedMarker = null;

    // Centre around chch
    var coords = [-43.5233, 172.5822];
    var zoomLevel = 16;

    // Create the map (without gpux)
    var map = L.map('map').setView(coords, zoomLevel);
    L.Browser.any3d = false;

    // Custom style to fit the app
    // see toolchain/snazzy.js for conversion
    var snazzyStyle = 's.e%3Al.i%7Cp.v%3Aoff%2Cs.e%3Al.t.f%7Cp.c%3A%23ffffffff%2Cs.e%3Al.t.s%7Cp.c%3A%23ff10141a%2Cs.t%3A0%7Cs.e%3Ag%7Cp.c%3A%23ff364253%2Cs.t%3A81%7Cs.e%3Ag%7Cp.c%3A%23ff2c3645%2Cs.t%3A6%7Cs.e%3Ag%7Cp.c%3A%23ff2d6ca3%2Cs.t%3A3%7Cs.e%3Ag%7Cp.c%3A%23ff5c6978%2Cs.t%3A39%7Cs.e%3Ag%7Cp.c%3A%23ff1f6b45%2Cs.t%3A40%7Cs.e%3Ag%7Cp.c%3A%23ff1f6b45%2Cs.t%3A33%7Cs.e%3Ag%7Cp.c%3A%23ff1f6b45%2Cs.t%3A37%7Cs.e%3Ag%7Cp.c%3A%23ff1f6b45%2Cs.t%3A36%7Cs.e%3Ag%7Cp.c%3A%23ff364253%2Cs.t%3A4%7Cs.e%3Al%7Cp.v%3Aoff';

    // Draw the map tiles
    L.tileLayer(`https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&apistyle=${snazzyStyle}`, {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
        attribution: '&copy; Google Maps',
    }).addTo(map);

    // When no point is clicked clear the previous
    map.on('click', e => {
        const lat = e.latlng.lat;
        const lng = e.latlng.lng;

        L.DomEvent.stopPropagation(e);

        setSelectedPoint(null)
        onPosClicked(lat, lng);
    })

    // Cluster markers to prevent lag
    let marker;
    let markers = L.markerClusterGroup({disableClusteringAtZoom: 16});
    map.addLayer(markers);

</script>
</body>
</html>
