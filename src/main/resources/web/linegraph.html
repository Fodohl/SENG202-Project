<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <style>
        @font-face {
            font-family: 'noto-sans';
            src: url('../../../src/main/resources/fonts/NotoSans-Medium.ttf') format('ttf');
        }

        html, body {
            background: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            color: #21262e;
            text-align: center;
            margin-top: -0.5%;
              font-family: 'noto-sans', sans-serif;
        }

        #root {
            width: 100%;
            height: 100%;
            overflow: hidden;
            box-sizing: border-box;
            margin-left: -1%;
        }
    </style>

    <script src="../thirdparty/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="../thirdparty/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="../thirdparty/unpkg/prop-types/prop-types.min.js"></script>

    <script src="../thirdparty/unpkg/recharts@2/umd/Recharts.js"></script>
</head>
<body>
<h1>Collective Community Cleanliness</h1>
<div id="root">
</div>
<script>
    const data = [{"name": "Jan", "value": 280.0}, {"name": "Feb", "value": 190.0}, {
        "name": "Mar",
        "value": 280.0
    }, {"name": "Apr", "value": 300.0}, {"name": "May", "value": 205.0}, {"name": "Jun", "value": 430.0}]

    const {AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Label} = Recharts;

    //     const chart = (
    //         <ResponsiveContainer width="100%" height="100%">
    //             <AreaChart data={data}>
    //                 <CartesianGrid stroke={stroke} strokeDasharray="4 4" />
    //                 <XAxis dataKey="name" stroke={stroke} tick={{ fill: text_primary }} axisLine={{ stroke }} />
    //                 <YAxis dataKey="value" stroke={stroke} tick={{ fill: text_primary }} axisLine={{ stroke }} />
    //                 <Tooltip contentStyle={{ background: bg_primary, border: `1px solid ${text_secondary}`, borderRadius: 15, color: text_primary }} />
    //                 <Area
    //                     type="monotone"
    //                     dataKey="value"
    //                     stroke="#4ADE80"
    //                     strokeWidth={3}
    //                     fill={active}
    //                     fillOpacity={0.2}
    //                 />
    //             </AreaChart>
    //         </ResponsiveContainer>
    //     );

    // Theme colours (react cant parse css vars)
    const text_primary = "#21262e"
    const text_secondary = "#6c6d68"
    const active = "#278c4a"
    const active_light = "#7dba92"
    const bg_primary = "#ffffff"
    const grid_line = "#d2cbc2"

    const stroke = grid_line

    // Chart components
    const grid = React.createElement(CartesianGrid, {stroke, strokeDasharray: "4 4"})
    const xlabel = React.createElement(Label, {value: "Month", style: { fill: text_primary }})
    const xaxis = React.createElement(XAxis, {dataKey: "name",  stroke: text_secondary, tick: {fill: text_secondary}, axisLine: {stroke: text_secondary}, height: 60}, xlabel)
    const ylabel = React.createElement(Label, {value: "Items", angle: -90, position: "insideLeft", offset: 15, style: { fill: text_primary }})
    const yaxis = React.createElement(YAxis, {dataKey: "value", stroke: text_secondary, tick: {fill: text_secondary}, axisLine: {stroke: text_secondary}, width: 70}, ylabel)
    const tooltip = React.createElement(Tooltip, {
        contentStyle: {
            background: bg_primary,
            border: `1px solid ${grid_line}`,
            borderRadius: 15,
            color: text_primary
        }
    })
    const area = React.createElement(Area, {
        type: "monotone",
        dataKey: "value",
        stroke: active,
        strokeWidth: 3,
        fill: active,
        fillOpacity: 0.2,
    })

    const chart = React.createElement(ResponsiveContainer, {width: "97%", height: "86%"},
        React.createElement(AreaChart, {data},
            grid,
            xaxis,
            yaxis,
            tooltip,
            area,
        )
    );

    ReactDOM.createRoot(document.getElementById("root")).render(chart);

</script>
</body>
</html>
