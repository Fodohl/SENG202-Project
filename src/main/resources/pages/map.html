<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <!-- leaflet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
</head>
<body>

    <div id="map" style="width: 100vw; height: 100vh" class="map-container dark-tiles">
    </div>

    <script>
        var coords = [-43.5233, 172.5822];
        var zoomLevel = 17;
        var map = L.map('map').setView(coords, zoomLevel);
        var snazzyStyle = 's.e%3Al.i%7Cp.v%3Aoff%2Cs.t%3A2%7Cp.v%3Aoff%2Cp.il%3Atrue%2Cp.s%3A10%2Cp.l%3A38%2Cp.g%3A0.5%2Cp.h%3A%23435158';
        L.Browser.any3d = false;
        L.tileLayer(`https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&apistyle=${snazzyStyle}`, {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
        attribution: '&copy; Google Maps'
        }).addTo(map);
    </script>
</body>
</html>
