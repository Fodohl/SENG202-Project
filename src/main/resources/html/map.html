<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <!-- Leaflet core -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

    <!-- Leaflet.markercluster plugin -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <!-- Leflet.pouchdb plugin -->
	<script src="https://unpkg.com/pouchdb@^5.2.0/dist/pouchdb.js"></script>
	<script src="https://unpkg.com/leaflet.tilelayer.pouchdbcached@latest/L.TileLayer.PouchDBCached.js"></script>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .leaflet-tile-container img {
            outline: 1px solid transparent;
            mix-blend-mode: multiply;
        }
    </style>
</head>
<body>

    <div id="map" style="width: 100vw; height: 100vh" class="map-container dark-tiles">
    </div>

    <script>

        // Define bridge helpers
        callJavaAPI = (functionName, params = {}) => {

            // Add salt to prevent call cache
            params = {
                ...params,
                _: Math.random()
            }

            // Convert the params into URL format
            const searchParams = new URLSearchParams(params);
            const queryString = searchParams.toString();

            const url = `http://trashapp.local/api/v1/${functionName}${queryString ? '?' + queryString : ''}`;
            window.location.href = url;
        }

        onPointClicked = (id) => {
            callJavaAPI("onPointClicked", {"id": id});
        }

        makeIcon = (L, name) => {
            return L.icon({
                iconUrl: `../images/pin-${name}.svg`,
                iconSize: [40, 50],
            });
        }

        // Centre around chch
        var coords = [-43.5233, 172.5822];
        var zoomLevel = 16;

        // Create the map (without gpux)
        var map = L.map('map').setView(coords, zoomLevel);
        L.Browser.any3d = false;

        // Custom style to fit the app
        // see toolchain/snazzy.js for conversion
        var snazzyStyle = 's.e%3Al.i%7Cp.v%3Aoff%2Cs.e%3Al.t.f%7Cp.c%3A%23ffffffff%2Cs.e%3Al.t.s%7Cp.c%3A%23ff10141a%2Cs.t%3A0%7Cs.e%3Ag%7Cp.c%3A%23ff364253%2Cs.t%3A81%7Cs.e%3Ag%7Cp.c%3A%23ff2c3645%2Cs.t%3A6%7Cs.e%3Ag%7Cp.c%3A%23ff2d6ca3%2Cs.t%3A3%7Cs.e%3Ag%7Cp.c%3A%23ff5c6978%2Cs.t%3A39%7Cs.e%3Ag%7Cp.c%3A%23ff1f6b45%2Cs.t%3A40%7Cs.e%3Ag%7Cp.c%3A%23ff1f6b45%2Cs.t%3A33%7Cs.e%3Ag%7Cp.c%3A%23ff1f6b45%2Cs.t%3A37%7Cs.e%3Ag%7Cp.c%3A%23ff1f6b45%2Cs.t%3A36%7Cs.e%3Ag%7Cp.c%3A%23ff364253%2Cs.t%3A4%7Cs.e%3Al%7Cp.v%3Aoff';

        // Draw the map tiles
        L.tileLayer(`https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&apistyle=${snazzyStyle}`, {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '&copy; Google Maps',
        }).addTo(map);

        // When no point is clicked clear the previous
        map.on('click', () => {
            onPointClicked(null)
        })

        // Cluster markers to prevent lag
        let marker;
        let markers = L.markerClusterGroup({disableClusteringAtZoom: 16});
        map.addLayer(markers);

    </script>
</body>
</html>
