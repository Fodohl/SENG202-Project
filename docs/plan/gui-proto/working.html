<!-- Impl note: svg colours hardcoded here, will change incode if javafx supports as html doesnt -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="styles.css">

    <!-- leaflet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script type="text/javascript" src="http://code.jquery.com/jquery-1.7.1.min.js"></script>
    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet/leaflet-maplibre-gl.js"></script>
</head>
<body>

<div class="app">

    <div class="sidebar">
        <div class="logo">

            <img src="../../../src/main/resources/images/logo.svg">
            <h1>TrashApp</h1>

        </div>

        <div class="navbar">

            <div class="navitem active">
                <img src="../../../src/main/resources/images/dashboard.svg">
                <a>Dashboard</a>
            </div>

            <div class="navitem hover">
                <img src="../../../src/main/resources/images/map.svg">
                <a>Map</a>
            </div>

            <div class="navitem">
                <img src="../../../src/main/resources/images/leaderboard.svg">
                <a>Leaderboard</a>
            </div>

            <div class="navitem">
                <img src="../../../src/main/resources/images/timeline.svg">
                <a>Trash Timeline</a>
            </div>

            <div class="navitem bottom">
                <img src="../../../src/main/resources/images/settings.svg">
                <a>Settings</a>
            </div>

        </div>
    </div>

    <div class="page">

        <div class="header">

            <div class="search-bar">
                <img src="../../../src/main/resources/images/search.svg">
                <p>Enter address...</p>
            </div>

            <div class="account end">
                Account (DB)
            </div>

        </div>

        <div class="content">
<div class="map">

                <div id="map" class="map-container dark-tiles">
                </div>

                <div class="pop-over-side-bar">
                    <div class="section title">
                        <p>Bin Details</p>
                    </div>

                    <div class="section">
                        <div class="kv-pair">
                            <p class="key">ID:</p>
                            <p class="value">1234</p>
                        </div>
                        <div class="bin-icon">
                            <img src="../../../src/main/resources/images/bin.png">
                        </div>
                         <div class="kv-pair">
                            <p class="key">Type:</p>
                            <p class="value">Recycling</p>
                        </div>
                         <div class="kv-pair">
                            <p class="key">Status:</p>
                            <p class="value">15% Full (estimate)</p>
                        </div>
                         <div class="kv-pair">
                            <p class="key">Updated:</p>
                            <p class="value">26 August 2026 (11:00PM)</p>
                        </div>

                    </div>

                    <div class="section">
                          <div class="kv-pair">
                            <p class="key">Address:</p>
                            <p class="value">7 Hagely Park Street</p>
                        </div>
                    </div>

                      <div class="section">
                          <div class="kv-pair">
                            <p class="key">Next Collection:</p>
                            <p class="value">5th May (Thursday)</p>
                        </div>
                    </div>

                     <div class="section buttons">
                         <button> Get Directions </button>
                         <button> Log Entry </button>
                         <button> Report Issue </button>
                     </div>

                </div>

            </div>
<!-- credit: https://gist.github.com/jscarto/9276103 -->
<script>
var coords = [-43.5233, 172.5822];
var zoomLevel = 17;
var map = L.map('map').setView(coords, zoomLevel);
var snazzyStyle = 's.e%3Al.i%7Cp.v%3Aoff%2Cs.t%3A2%7Cp.v%3Aoff%2Cp.il%3Atrue%2Cp.s%3A10%2Cp.l%3A38%2Cp.g%3A0.5%2Cp.h%3A%23435158';
L.tileLayer(`https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&apistyle=${snazzyStyle}`, {
    maxZoom: 20,
    subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
    attribution: '&copy; Google Maps'
}).addTo(map);
</script>


        </div>
    </div>
</div>
</body>
</html>
