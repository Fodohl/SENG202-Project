// https://github.com/OpenAPITools/openapi-generator/blob/master/modules/openapi-generator-gradle-plugin/build.gradle
import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

plugins {
    id 'application'
    id 'java'
    id "org.openjfx.javafxplugin" version "0.1.0"
    id 'jacoco'
    id "org.openapi.generator" version "7.25.0"
    id 'org.springframework.boot' version '4.2.0-M1'
}

base {
    archivesName = 'seng202_team1_trashapp'
}

group = 'seng202.team1'
version = '1.0-SNAPSHOT'

def mainClassName = 'seng202.team1.TrashApp'

def javaVersion = '25'
def javafxVersion = '25.0.3'
def log4jVersion = '2.26.1'
def cucumberVersion = '7.34.4'
def junitVersion = '6.0.3'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}


repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

sourceSets {
    common {
    }
    backend {
        java.srcDir 'src/backend/java'
        resources.srcDir 'src/backend/resources'
        compileClasspath += sourceSets.common.output
        runtimeClasspath += sourceSets.common.output
    }
    main {
        compileClasspath += sourceSets.common.output
        runtimeClasspath += sourceSets.common.output
    }
    test {
        compileClasspath += sourceSets.common.output
        runtimeClasspath += sourceSets.common.output
    }
}

configurations {
    commonImplementation.extendsFrom implementation
    backendImplementation.extendsFrom implementation
}

dependencies {
    // https://mvnrepository.com/artifact/org.openjfx/javafx-controls
    implementation "org.openjfx:javafx-controls:${javafxVersion}"

    // https://mvnrepository.com/artifact/org.openjfx/javafx-fxml
    implementation "org.openjfx:javafx-fxml:${javafxVersion}"

    // https://mvnrepository.com/artifact/org.openjfx/javafx-web
    implementation "org.openjfx:javafx-web:${javafxVersion}"

    // https://mvnrepository.com/artifact/org.xerial/sqlite-jdbc
    implementation 'org.xerial:sqlite-jdbc:3.53.2.0'

    // https://mvnrepository.com/artifact/com.opencsv/opencsv
    implementation 'com.opencsv:opencsv:5.12.0'

    // https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-api
    implementation "org.apache.logging.log4j:log4j-api:${log4jVersion}"

    // https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-core
    implementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"

    // https://mvnrepository.com/artifact/io.github.cdimascio/java-dotenv
    implementation 'io.github.cdimascio:java-dotenv:5.2.2'

    // https://mvnrepository.com/artifact/com.googlecode.json-simple/json-simple
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'

    // https://mvnrepository.com/artifact/io.cucumber/cucumber-junit-platform-engine
    testImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"

    // https://mvnrepository.com/artifact/io.cucumber/cucumber-java
    testImplementation "io.cucumber:cucumber-java:${cucumberVersion}"

    // https://mvnrepository.com/artifact/io.cucumber/cucumber-junit
    testImplementation "io.cucumber:cucumber-junit:${cucumberVersion}"

    // https://mvnrepository.com/artifact/org.junit.platform/junit-platform-suite
    testImplementation 'org.junit.platform:junit-platform-suite:1.8.2'

    // https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-api
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"

    // https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"

    // https://mvnrepository.com/artifact/org.assertj/assertj-core
    testImplementation 'org.assertj:assertj-core:3.27.7'

    // https://mvnrepository.com/artifact/org.mockito/mockito-core
    testImplementation 'org.mockito:mockito-core:5.4.0'

    // https://github.com/hervegirod/fxsvgimage
    implementation 'com.github.hervegirod:fxsvgimage:1.7.3'
    implementation 'com.github.hervegirod:fxsvgimage:1.7.3:cssparser'

    // https://github.com/makbn/java_leaflet
    implementation 'io.github.makbn:jlmap-fx:2.0.0'

    /// https://mvnrepository.com/artifact/org.testfx/openjfx-monocle
    testImplementation "org.testfx:openjfx-monocle:jdk-12.0.1+2"

    // https://org.jooq
    implementation "org.jooq:jooq:3.21.8"

    // https://mvnrepository.com/artifact/fr.brouillard.oss/cssfx
    implementation 'fr.brouillard.oss:cssfx:11.5.1'

    // https://mvnrepository.com/artifact/com.google.code.gson/gson
    implementation 'com.google.code.gson:gson:2.14.0'

    // deps of openapi
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.19.2'
    implementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.54'

    // https://mvnrepository.com/artifact/org.springframework.boot/spring-boot
    implementation 'org.springframework.boot:spring-boot:4.2.0-M1'

    // https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter
    implementation 'org.springframework.boot:spring-boot-starter:4.2.0-M1'

    // https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-web
    implementation 'org.springframework.boot:spring-boot-starter-web:4.2.0-M1'

    // https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-validation
    implementation 'org.springframework.boot:spring-boot-starter-validation:4.2.0-M1'

    // https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator:4.2.0-M1'

    // https://mvnrepository.com/artifact/io.micrometer/micrometer-registry-prometheus
    implementation 'io.micrometer:micrometer-registry-prometheus:1.18.0-M1'

    // https://mvnrepository.com/artifact/commons-validator/commons-validator
    implementation 'commons-validator:commons-validator:1.11.0'
}

application {
    // Define the main class for the application.
    mainClass = mainClassName
}

javafx {
    version = "${javafxVersion}"
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.web', 'javafx.swing' ]
}

test {
    useJUnitPlatform()
    systemProperty 'glass.platform', 'Monocle'
    systemProperty 'monocle.platform', 'Headless'
    systemProperty 'prism.order', 'sw'
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'testfx.headless', 'true'

    filter {
        includeTestsMatching "seng202.team1.unittests.*"
    }

    finalizedBy jacocoTestReport
}


tasks.register("cucumber", Test)  {
    group = "verification"

     testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform()

    filter {
        includeTestsMatching "seng202.team1.cucumber.*"
    }

    testLogging {
        events "failed"
        exceptionFormat "full"
    }

    finalizedBy jacocoTestReport
}

tasks.named("check") {
    dependsOn test, cucumber

    finalizedBy jacocoTestReport
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from sourceSets.common.output

    manifest {
        attributes 'Main-Class': mainClassName
    }
    from {
        configurations.runtimeClasspath.collect {it.isDirectory()?it:zipTree(it)}
    }
}

// Jacoco test coverage config
jacoco {
    toolVersion = "0.8.14"
}

jacocoTestReport {
    // Build a lazy FileTree under the build directory
    def execTrees = layout.buildDirectory
            .dir("jacoco")
            .map { dir ->
                dir.asFileTree.matching {
                    include("**/*.exec")
                }
            }

    // Provide the FileTree lazily to the executionData property
    executionData.setFrom(execTrees)

    reports {
        html.outputLocation = layout.buildDirectory.dir("reports/tests/coverage")
    }
}

// Suppress warnings
tasks.withType(JavaExec).configureEach {
    jvmArgs += [
        '--enable-native-access=ALL-UNNAMED',
        '--enable-native-access=javafx.web',
        '--enable-native-access=javafx.graphics',
    ]
    systemProperties System.getProperties()
}
tasks.withType(Test).configureEach {
    jvmArgs += [
        '--enable-native-access=ALL-UNNAMED'
    ]
}

def spec = layout.projectDirectory.file('src/common/resources/openapi.json')

// https://openapi-generator.tech/docs/plugins
openApiGenerate {
    cleanupOutput.set(true)
    generatorName.set('java')
    library.set('native')
    inputSpec.set(spec)
    outputDir.set(layout.buildDirectory.dir('generated/common'))
    apiPackage.set('seng202.team1.taserver.api')
    modelPackage.set('seng202.team1.taserver.model')
    invokerPackage.set('seng202.team1.taserver.client')
    workerIsolation.set('process')
    configOptions.set([openApiNullable: 'false',
                       useJakartaEe: 'true'
                    ])
}

tasks.register('generateBackend', GenerateTask) {
    cleanupOutput.set(true)
    generatorName.set('spring')
    inputSpec.set(spec)
    outputDir.set(layout.buildDirectory.dir('generated/backend'))
    apiPackage.set('seng202.team1.api')
    modelPackage.set('seng202.team1.taserver.model')
    workerIsolation.set('process')
    globalProperties.set([apis: ''])
    configOptions.set([interfaceOnly: 'true',
                       useSpringBoot3: 'true',
                       useTags: 'true',
                       skipDefaultInterface: 'true',
                       openApiNullable: 'false',
                       requestMappingMode: 'api_interface'
                    ])
}

sourceSets.common.java.srcDir  layout.buildDirectory.dir('generated/common/src/main/java')
sourceSets.backend.java.srcDir layout.buildDirectory.dir('generated/backend/src/main/java')

compileCommonJava.dependsOn tasks.named("openApiGenerate")
compileBackendJava.dependsOn tasks.named("generateBackend")

tasks.register('server', JavaExec) {
    group = 'application'
    classpath = sourceSets.backend.runtimeClasspath
    mainClass = 'seng202.team1.TAServer'
}

// dont let spring package itself into client
tasks.named('bootJar') {
    enabled = false
}

// make sure config replacest he default one
tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('backendJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
    group = 'build'
    mainClass = 'seng202.team1.TAServer'
    classpath = sourceSets.backend.output + sourceSets.common.output + configurations.backendRuntimeClasspath
    archiveFileName = 'taserver.jar'
    targetJavaVersion = "VERSION_${javaVersion}"
}